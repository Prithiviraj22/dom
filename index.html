<html>

<head>


</head>

<body>


    <input type="text" id="In">

    <button id="Btn">Add Task</button>

    <p id="error"></p>

    <ul id="Task"></ul>

    <script>

        let input = document.querySelector("#In");
        let Btn = document.querySelector("#Btn");
        let Task = document.querySelector("#Task");
        let error = document.querySelector("#error");

        Btn.addEventListener("click", function f1 () {

            let task = input.value;
             input.value = "";
             error.innerText = "";

            if (task == "") {

             error.innerText = "Please enter a task";
                return;
            }


            let li = document.createElement("li");

            let taskName = document.createElement("span");
            taskName.innerText = task;

            let complete = document.createElement("button");
            complete.innerText = "Complete";

            let delete1 = document.createElement("button");
            delete1.innerText = "Delete";

              li.appendChild(taskName);
              li.appendChild(complete);
              li.appendChild(delete1);

            Task.appendChild(li);

            complete.addEventListener("click", function f1 () {
                taskName.style.textDecoration = "line-through";
            });

            delete1.addEventListener("click", function f1 () {
                li.remove();
            });
            


        });
    </script>

</body>
</html>
